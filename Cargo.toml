[package]
name = "scrapheap"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20", features = ["wav"] }
rapier3d = "0.36"

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.20", features = ["webgl2", "wav", "debug"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
web-sys = { version = "0.3", features = ["Window", "Location"] }

# fast-enough dev builds: our code at O1, deps fully optimised
[profile.dev]
opt-level = 1
debug = false
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.wasm-release]
inherits = "release"
opt-level = "z"
strip = "debuginfo"
