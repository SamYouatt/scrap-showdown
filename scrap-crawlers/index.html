<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scrap Crawlers</title>
    <style>
      :root {
        --ink: #f2e6cf;
        --dim: #b7a98f;
        --panel: rgba(32, 27, 26, 0.9);
        --edge: #5a4a3c;
        --hi: #e0a040;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #222; color: var(--ink);
        font: 13px/1.35 ui-monospace, 'Cascadia Mono', Menlo, Consolas, monospace; }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #overlay { pointer-events: none; }
      #panel { position: absolute; top: 12px; right: 12px; bottom: 12px; width: 272px; overflow-y: auto;
        background: var(--panel); border: 2px solid var(--edge); box-shadow: 4px 4px 0 rgba(0,0,0,.35); padding: 10px 12px; }
      h1 { margin: 0 0 2px; font-size: 16px; letter-spacing: 1px; color: var(--hi); text-transform: uppercase; }
      .sub { color: var(--dim); margin-bottom: 8px; }
      h2 { margin: 12px 0 4px; font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 2px;
        border-bottom: 1px dashed var(--edge); padding-bottom: 2px; }
      label { display: grid; grid-template-columns: 96px 1fr 38px; align-items: center; gap: 6px; margin: 3px 0; }
      label.check { grid-template-columns: 96px 1fr; }
      label span.v { text-align: right; color: var(--hi); }
      input[type=range] { width: 100%; accent-color: var(--hi); }
      select { width: 100%; background: #2b2422; color: var(--ink); border: 1px solid var(--edge); font: inherit; padding: 1px 2px; }
      .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
      button { background: #3b302b; color: var(--ink); border: 2px solid var(--edge); font: inherit; padding: 5px 6px; cursor: pointer;
        box-shadow: 2px 2px 0 rgba(0,0,0,.4); }
      button:hover { border-color: var(--hi); }
      button:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 rgba(0,0,0,.4); }
      #hud { position: absolute; left: 12px; bottom: 12px; background: var(--panel); border: 2px solid var(--edge); padding: 6px 10px;
        color: var(--dim); white-space: pre; pointer-events: none; }
      #hud b { color: var(--ink); font-weight: normal; }
      #nogpu { position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 40px; background: #1d1918; }
      #nogpu div { max-width: 520px; }
    </style>
  </head>
  <body>
    <canvas id="gpu"></canvas>
    <canvas id="overlay"></canvas>
    <div id="panel">
      <h1>Scrap Crawlers</h1>
      <div class="sub">procedural walker bench</div>
      <div id="controls"></div>
    </div>
    <div id="hud"></div>
    <div id="nogpu"><div><h1>WebGPU unavailable</h1><p id="nogpu-msg"></p>
      <p>Try a recent Chrome, Edge or Safari, or Firefox Nightly with WebGPU enabled.</p></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
