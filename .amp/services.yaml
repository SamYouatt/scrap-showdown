services:
  game:
    command: ./scrapheap-rumble/dev-web.sh
    health: /index.html
    portal:
      title: Scrapheap Rumble
      description: First compilation takes several minutes. Edits rebuild automatically; refresh after the build finishes.
    portals:
      - url: /?scene=workshop
        title: Workshop
      - url: /?scene=fight&opp=2&test=1
        title: Test fight
      - url: /?scene=lookdev&spin=1
        title: Art look-dev
  crawlers:
    command: pnpm install --frozen-lockfile && exec pnpm exec vite --port "$PORT"
    cwd: scrap-crawlers
    health: /
    portal:
      title: Scrap Crawlers
      description: WebGPU procedural-walker prototype. Needs a WebGPU browser (recent Chrome/Edge/Safari). Vite hot-reloads edits.
    portals:
      - url: /?debug=1
        title: Scrap Crawlers (IK debug)
